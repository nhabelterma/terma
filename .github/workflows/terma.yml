name: WX_99_AHH
on:
  workflow_dispatch:

jobs:
  px_proc:
    runs-on: windows-latest
    timeout-minutes: 630

    steps:
      - name: S1
        run: |
          $g81 = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $g82 = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          
          $g83 = Get-ItemProperty -Path $g81 -Name "fDenyTSConnections" -ErrorAction SilentlyContinue
          if ($g83) { Set-ItemProperty -Path $g81 -Name "fDenyTSConnections" -Value 0 -Force }
          
          $g84 = Get-ItemProperty -Path $g82 -Name "UserAuthentication" -ErrorAction SilentlyContinue
          if ($g84) { Set-ItemProperty -Path $g82 -Name "UserAuthentication" -Value 0 -Force }
          
          $g85 = Get-ItemProperty -Path $g82 -Name "SecurityLayer" -ErrorAction SilentlyContinue
          if ($g85) { Set-ItemProperty -Path $g82 -Name "SecurityLayer" -Value 0 -Force }

          $g86 = netsh advfirewall firewall show rule name="L_GATE" | Select-String "L_GATE"
          if ($g86) { netsh advfirewall firewall delete rule name="L_GATE" }
          
          $g87 = netsh advfirewall firewall add rule name="L_GATE" dir=in action=allow protocol=TCP localport=3389
          
          $g88 = Get-Service -Name TermService -ErrorAction SilentlyContinue
          if ($g88.Status -eq 'Running') { Restart-Service -Name TermService -Force }

      - name: S2
        run: |
          $h21 = "${{ secrets.OFF_PASSWORD }}"
          $h22 = [System.Text.Encoding]::UTF8.GetBytes($h21)
          $h23 = [System.Convert]::ToBase64String($h22)
          $h24 = [System.Runtime.InteropServices.Marshal]::SecureStringToBSTR((ConvertTo-SecureString $h21 -AsPlainText -Force))
          $h25 = [System.Runtime.InteropServices.Marshal]::PtrToStringBSTR($h24)
          
          $h26 = Get-LocalUser -Name "user67" -ErrorAction SilentlyContinue
          if (-not $h26) { 
            $h27 = ConvertTo-SecureString $h21 -AsPlainText -Force
            New-LocalUser -Name "user67" -Password $h27 -AccountNeverExpires
          }
          
          $h28 = Get-LocalGroupMember -Group "Administrators" -Member "user67" -ErrorAction SilentlyContinue
          if (-not $h28) { Add-LocalGroupMember -Group "Administrators" -Member "user67" }
          
          $h29 = Get-LocalGroupMember -Group "Remote Desktop Users" -Member "user67" -ErrorAction SilentlyContinue
          if (-not $h29) { Add-LocalGroupMember -Group "Remote Desktop Users" -Member "user67" }
          
          $h30 = "ID: user67 | KEY: $h21"
          $h31 = [System.Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($h30))
          echo "D_STR=$h31" >> $env:GITHUB_ENV

      - name: S3
        run: |
          $i41 = Get-ExecutionPolicy
          if ($i41 -ne 'Bypass') { Set-ExecutionPolicy Bypass -Scope Process -Force }
          
          $i42 = [System.Net.ServicePointManager]::SecurityProtocol
          [System.Net.ServicePointManager]::SecurityProtocol = $i42 -bor 3072
          
          $i43 = Get-Command choco -ErrorAction SilentlyContinue
          if (-not $i43) {
            $i44 = (New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1')
            $i45 = [System.Text.Encoding]::UTF8.GetBytes($i44)
            $i46 = [System.Convert]::ToBase64String($i45)
            $i47 = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($i46))
            iex $i47
          }
          
          $i48 = @("python", "nmap", "angryip", "notepadplusplus", "vscode", "telegram", "7zip")
          foreach ($i49 in $i48) {
            $i50 = choco list --local-only $i49
            if ($i50 -like "*$i49*") { continue }
            choco install $i49 -y --limit-output --no-progress
          }

      - name: S4
        run: |
          $j61 = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $j62 = "$env:TEMP\sys_inst.msi"
          $j63 = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*"
          $j64 = Get-ItemProperty -Path $j63 | Where-Object {$_.DisplayName -like "*Tailscale*"}
          
          if (-not $j64) {
            $j65 = Invoke-WebRequest -Uri $j61 -OutFile $j62 -PassThru
            if ($j65.StatusCode -eq 200) {
              $j66 = Start-Process msiexec.exe -ArgumentList "/i", "`"$j62`"", "/quiet", "/norestart", "/nologo" -Wait -PassThru
              if ($j66.ExitCode -eq 0 -or $j66.ExitCode -eq 3010) {
                if (Test-Path $j62) { Remove-Item $j62 -Force }
              }
            }
          }

      - name: S5
        run: |
          $k71 = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $k72 = Get-Process -Name "tailscale" -ErrorAction SilentlyContinue
          if (-not $k72) { Start-Process -FilePath $k71 -ArgumentList "up --authkey=${{ secrets.OFFSCALE_AUTH_KEY }} --hostname=NODE-$env:GITHUB_RUN_ID" -NoNewWindow -Wait }
          
          $k73 = $null
          $k74 = 0
          $k75 = 10
          while (-not $k73 -and $k74 -lt $k75) {
            $k73 = & $k71 ip -4 2>$null
            if (-not $k73) {
              Start-Sleep -Seconds 5
              $k74++
            }
          }
          $k76 = [System.Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($k73))
          echo "SIG_ID=$k76" >> $env:GITHUB_ENV

      - name: S6
        run: |
          $l81 = "LS0tIFVQIC0tLQ=="
          $l82 = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($l81))
          Write-Host $l82
          
          $l83 = "Qzog"
          $l84 = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($l83))
          $l85 = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($env:SIG_ID))
          Write-Host "$l84 $l85"
          
          $l86 = 0
          while ($true) {
            $l87 = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
            $l88 = "WyR7bDg3fV0gUF9PSw=="
            $l89 = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($l88))
            Write-Host $l89
            $l86++
            Start-Sleep -Seconds 300
          }
